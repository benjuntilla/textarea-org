<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<title>Textarea</title>
<style>
  @font-face {
    font-family: 'Crimson Pro';
    src: url('fonts/crimson-pro.woff2') format('woff2');
    font-weight: 200 900;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Crimson Pro';
    src: url('fonts/crimson-pro-italic.woff2') format('woff2');
    font-weight: 200 900;
    font-style: italic;
    font-display: swap;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    color-scheme: light dark;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;

    background-color: #fff;
    --elevated: #fff;
    --link: #0066cc;
    --text: #161616;
    --outline: #007aff;

    @media (prefers-color-scheme: dark) {
      background-color: #000;
      --elevated: #121212;
      --link: #58a6ff;
      --text: #fff;
    }
  }

  body {
    color: var(--text);
  }

  a {
    color: var(--link);
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
  }

  article {
    outline: none;
    padding: 18px max(18px, calc(50vw - 400px));
    width: 100%;
    min-height: 100dvh;
    font: 18px / 1.5 'Crimson Pro', serif;
    tab-size: 4;
    white-space: pre-wrap;
    text-wrap-style: stable;
    overflow-wrap: break-word;
  }

  .org-h1,
  .org-h2,
  .org-h3,
  .org-h4,
  .org-h5,
  .org-h6 {
    font-weight: 700;
  }

  .org-h1 {
    font-size: 2em;
  }

  .org-h2 {
    font-size: 1.5em;
  }

  .org-h3 {
    font-size: 1.25em;
  }

  .org-h4 {
    font-size: 1.1em;
  }

  .org-h5 {
    font-size: 1em;
  }

  .org-h6 {
    font-size: 0.9em;
  }

  .org-code,
  .org-verbatim,
  .org-codeblock {
    font-family: monospace;
  }

  .org-bold {
    font-weight: bold;
  }

  .org-strike {
    text-decoration: line-through;
  }

  .org-italic {
    font-style: italic;
  }

  .org-underline {
    text-decoration: underline;
  }

  .org-url,
  .org-link {
    cursor: pointer;
  }

</style>
<article contenteditable="plaintext-only" spellcheck autofocus></article>
<script>
  const article = document.querySelector('article')
  const editor = new Editor(article, parseOrg)
  article.addEventListener('input', debounce(500, save))
  article.addEventListener('blur', save)
  article.addEventListener('click', event => {
    if (event.target.tagName === 'A') window.open(event.target.getAttribute('href'), '_blank')
  })
  article.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== 'Backspace') return
    if (event.metaKey || event.ctrlKey || event.altKey) return
    const sel = getSelection()
    if (!sel.rangeCount || !sel.isCollapsed) return
    const range = sel.getRangeAt(0).cloneRange()
    range.setStart(article, 0)
    const action = autolistAction(article.textContent, range.toString().length, event.key)
    if (!action) return
    if (action.insert) {
      // execCommand('insertText') turns \n into <br>, which textContent drops.
      // Let the native Enter insert the line break, then add the bullet.
      article.addEventListener('input', e => {
        if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') {
          document.execCommand('insertText', false, action.insert.slice(1))
        }
      }, {once: true})
      return
    }
    event.preventDefault()
    for (let n = action.deleteBack ?? 0; n > 0; n--) document.execCommand('delete')
  })
  addEventListener('DOMContentLoaded', load)
  addEventListener('hashchange', load)
  addEventListener('load', () => new MutationObserver(save).observe(article, {attributeFilter: ['style']}))
  addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.code === 'KeyS') {
      e.preventDefault()
      downloadHTML()
    }
  })
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
  }

  console.log('%cGitHub https://github.com/antonmedv/textarea', 'font-size: 16px; border: 1px solid lightblue; border-radius: 12px; padding: 10px 14px; ')

  async function load() {
    try {
      if (location.hash !== '') await set(location.hash)
    } catch (e) {
      article.textContent = ''
      article.removeAttribute('style')
    }
    updateTitle()
  }

  async function save() {
    const hash = await get()
    if (location.hash !== hash) history.replaceState({}, '', hash)
    updateTitle()
  }

  async function set(hash) {
    if (!hash) return
    const [content, style] = (await decompress(hash.slice(1))).split('\x00')
    editor.set(content)
    if (style) article.setAttribute('style', style)
  }

  async function get() {
    const style = article.getAttribute('style')
    const content = article.textContent + (style !== null ? '\x00' + style : '')
    return '#' + await compress(content)
  }

  function updateTitle() {
    const text = article.textContent
    const match = text.match(/^#\+title:[ \t]*(.+)$/im) ?? text.match(/^\*+[ \t]+(.+)$/m)
    document.title = match?.[1] ?? 'Textarea'
  }

  async function compress(string) {
    const byteArray = new TextEncoder().encode(string)
    const stream = new CompressionStream('deflate-raw')
    const writer = stream.writable.getWriter()
    writer.write(byteArray)
    writer.close()
    const buffer = await new Response(stream.readable).arrayBuffer()
    return new Uint8Array(buffer).toBase64({alphabet: 'base64url'})
  }

  async function decompress(b64) {
    const byteArray = Uint8Array.fromBase64(b64, {alphabet: 'base64url'})
    const stream = new DecompressionStream('deflate-raw')
    const writer = stream.writable.getWriter()
    writer.write(byteArray)
    writer.close()
    const buffer = await new Response(stream.readable).arrayBuffer()
    return new TextDecoder().decode(buffer)
  }

  function debounce(ms, fn) {
    let timer
    return (...args) => {
      clearTimeout(timer)
      timer = setTimeout(() => fn(...args), ms)
    }
  }

  async function downloadHTML() {
    updateTitle()
    const doc = document.documentElement.cloneNode(true)
    doc.querySelectorAll('script').forEach(s => s.remove())
    doc.querySelector('article').removeAttribute('contenteditable')
    const html = '<!DOCTYPE html>\n' + doc.outerHTML

    if ('showSaveFilePicker' in window) {
      try {
        const handle = await showSaveFilePicker({
          suggestedName: document.title + '.html',
          types: [{
            description: 'HTML file',
            accept: {'text/html': ['.html']},
          }],
        })
        const writable = await handle.createWritable()
        await writable.write(html)
        await writable.close()
        return
      } catch (e) {
        if (e.name === 'AbortError') return
      }
    }

    const blob = new Blob([html], {type: 'text/html'})
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = document.title + '.html'
    a.click()
    URL.revokeObjectURL(url)
  }

  // org-autolist: Enter continues a list item (bullets, numbers, checkboxes),
  // Enter on an empty item ends the list, Backspace right after a bullet
  // erases it and joins with the previous line.
  function autolistAction(text, offset, key) {
    const lineStart = text.lastIndexOf('\n', offset - 1) + 1
    const nl = text.indexOf('\n', offset)
    const lineEnd = nl === -1 ? text.length : nl
    const line = text.slice(lineStart, lineEnd)
    const m = line.match(/^([ \t]*)([-+]|\d+[.)])([ \t]+)(\[[ xX-]\][ \t]*)?/)
    if (!m) return null
    const len = m[0].length
    if (key === 'Backspace') {
      if (offset !== lineStart + len) return null
      return {deleteBack: len + (lineStart > 0 ? 1 : 0)}
    }
    if (offset < lineStart + len) return null
    if (line.length === len) return {deleteBack: offset - lineStart}
    const n = parseInt(m[2], 10)
    const marker = isNaN(n) ? m[2] : (n + 1) + m[2].slice(String(n).length)
    return {insert: '\n' + m[1] + marker + m[3] + (m[4] ? '[ ] ' : '')}
  }

  function parseOrg(element) {
    const input = element.textContent
    const frag = document.createDocumentFragment()

    const matchers = [
      {name: 'org-codeblock', re: /#\+begin_(\w+)[^\n]*\n[\s\S]*?\n[ \t]*#\+end_\1/iy},
      {name: 'org-h1', re: /^\*[ \t]+[^\n]*$/my},
      {name: 'org-h2', re: /^\*{2}[ \t]+[^\n]*$/my},
      {name: 'org-h3', re: /^\*{3}[ \t]+[^\n]*$/my},
      {name: 'org-h4', re: /^\*{4}[ \t]+[^\n]*$/my},
      {name: 'org-h5', re: /^\*{5}[ \t]+[^\n]*$/my},
      {name: 'org-h6', re: /^\*{6,}[ \t]+[^\n]*$/my},
      {name: 'org-code', re: /~[^~\s](?:[^~\n]*[^~\s])?~/y, emphasis: true},
      {name: 'org-verbatim', re: /=[^=\s](?:[^=\n]*[^=\s])?=/y, emphasis: true},
      {name: 'org-bold', re: /\*[^*\s](?:[^*\n]*[^*\s])?\*/y, emphasis: true},
      {name: 'org-italic', re: /\/[^/\s](?:[^/\n]*[^/\s])?\//y, emphasis: true},
      {name: 'org-underline', re: /_[^_\s](?:[^_\n]*[^_\s])?_/y, emphasis: true},
      {name: 'org-strike', re: /\+[^+\s](?:[^+\n]*[^+\s])?\+/y, emphasis: true},
      {name: 'org-link', re: /\[\[[^\]\n]+?\](\[[^\]\n]+?\])?\]/y},
      {name: 'org-url', re: /https?:\/\/[^\s<>()\[\]{}"'`]+/y},
    ]

    // Org emphasis only counts next to whitespace/punctuation, so
    // /usr/local/bin and snake_case stay plain.
    const emphasisPre = /[\s\-('"{]/
    const emphasisPost = /[\s\-.,;:!?'")}\[\]]/

    const specials = ['~', '=', '*', '/', '_', '+', '#', '[', 'h']

    let i = 0
    while (i < input.length) {
      let matched = false
      for (const m of matchers) {
        if (m.emphasis && i > 0 && !emphasisPre.test(input[i - 1])) continue
        m.re.lastIndex = i
        const res = m.re.exec(input)
        if (res && res.index === i) {
          const raw = res[0]
          if (m.emphasis) {
            const post = input[i + raw.length]
            if (post !== undefined && !emphasisPost.test(post)) continue
          }
          if (m.name === 'org-url' || m.name === 'org-link') {
            const a = document.createElement('a')
            a.className = m.name
            a.href = m.name === 'org-link' ? raw.match(/^\[\[([^\]]+)\]/)[1] : raw
            a.textContent = raw
            a.target = '_blank'
            a.rel = 'noopener noreferrer'
            frag.appendChild(a)
          } else {
            const span = document.createElement('span')
            span.className = m.name
            span.textContent = raw
            frag.appendChild(span)
          }
          i += raw.length
          matched = true
          break
        }
      }

      if (matched) continue

      let next = input.length
      for (const ch of specials) {
        const idx = input.indexOf(ch, i)
        if (idx !== -1 && idx < next) next = idx
      }

      if (next === i) {
        frag.appendChild(document.createTextNode(input[i]))
        i++
        continue
      }

      frag.appendChild(document.createTextNode(input.slice(i, next)))
      i = next
    }

    article.textContent = ''
    article.appendChild(frag)
    article.normalize()
  }

  function Editor(element, highlight) {
    const listeners = []
    const history = []
    let at = -1, prev

    const debounceHighlight = debounce(30, () => {
      const pos = save()
      highlight(element)
      restore(pos)
    })

    const shouldRecord = (event) => {
      return !isUndo(event) && !isRedo(event)
        && event.key !== 'Meta'
        && event.key !== 'Control'
        && event.key !== 'Alt'
        && !event.key.startsWith('Arrow')
    }

    let recording = false
    const debounceRecordHistory = debounce(300, (event) => {
      if (shouldRecord(event)) {
        recordHistory()
        recording = false
      }
    })

    const on = (type, fn) => {
      listeners.push([type, fn])
      element.addEventListener(type, fn)
    }
    on('keydown', event => {
      if (event.defaultPrevented) return
      prev = toString()
      if (isUndo(event)) doUndo(event)
      if (isRedo(event)) doRedo(event)
      if (shouldRecord(event) && !recording) {
        recordHistory()
        recording = true
      }
    })
    on('keyup', event => {
      if (event.defaultPrevented) return
      if (event.isComposing) return
      if (prev !== toString()) debounceHighlight()
      debounceRecordHistory(event)
    })
    on('paste', () => setTimeout(recordHistory, 10))
    on('cut', () => setTimeout(recordHistory, 10))
    on('beforeinput', event => {
      if (event.inputType === 'historyUndo') doUndo(event)
      if (event.inputType === 'historyRedo') doRedo(event)
    })

    function save() {
      const s = getSelection()
      const pos = {start: 0, end: 0, dir: undefined}
      let {anchorNode, anchorOffset, focusNode, focusOffset} = s
      if (!anchorNode || !focusNode) throw 'error1'
      if (anchorNode === element && focusNode === element) {
        pos.start = (anchorOffset > 0 && element.textContent) ? element.textContent.length : 0
        pos.end = (focusOffset > 0 && element.textContent) ? element.textContent.length : 0
        pos.dir = (focusOffset >= anchorOffset) ? '->' : '<-'
        return pos
      }
      if (anchorNode.nodeType === Node.ELEMENT_NODE) {
        const node = document.createTextNode('')
        anchorNode.insertBefore(node, anchorNode.childNodes[anchorOffset])
        anchorNode = node
        anchorOffset = 0
      }
      if (focusNode.nodeType === Node.ELEMENT_NODE) {
        const node = document.createTextNode('')
        focusNode.insertBefore(node, focusNode.childNodes[focusOffset])
        focusNode = node
        focusOffset = 0
      }
      visit(element, el => {
        if (el === anchorNode && el === focusNode) {
          pos.start += anchorOffset
          pos.end += focusOffset
          pos.dir = anchorOffset <= focusOffset ? '->' : '<-'
          return 'stop'
        }
        if (el === anchorNode) {
          pos.start += anchorOffset
          if (!pos.dir) {
            pos.dir = '->'
          } else {
            return 'stop'
          }
        } else if (el === focusNode) {
          pos.end += focusOffset
          if (!pos.dir) {
            pos.dir = '<-'
          } else {
            return 'stop'
          }
        }
        if (el.nodeType === Node.TEXT_NODE) {
          if (pos.dir !== '->') pos.start += el.nodeValue.length
          if (pos.dir !== '<-') pos.end += el.nodeValue.length
        }
      })

      element.normalize()
      return pos
    }

    function restore(pos) {
      const s = getSelection()
      let startNode, startOffset = 0
      let endNode, endOffset = 0

      if (!pos.dir) pos.dir = '->'
      if (pos.start < 0) pos.start = 0
      if (pos.end < 0) pos.end = 0

      if (pos.dir === '<-') {
        const {start, end} = pos
        pos.start = end
        pos.end = start
      }

      let current = 0

      visit(element, el => {
        if (el.nodeType !== Node.TEXT_NODE) return

        const len = (el.nodeValue || '').length
        if (current + len > pos.start) {
          if (!startNode) {
            startNode = el
            startOffset = pos.start - current
          }
          if (current + len > pos.end) {
            endNode = el
            endOffset = pos.end - current
            return 'stop'
          }
        }
        current += len
      })

      if (!startNode) {
        startNode = element
        startOffset = element.childNodes.length
      }
      if (!endNode) {
        endNode = element
        endOffset = element.childNodes.length
      }

      if (pos.dir === '<-') {
        [startNode, startOffset, endNode, endOffset] = [endNode, endOffset, startNode, startOffset]
      }

      {
        const startEl = uneditable(startNode)
        if (startEl) {
          const node = document.createTextNode('')
          startEl.parentNode?.insertBefore(node, startEl)
          startNode = node
          startOffset = 0
        }
        const endEl = uneditable(endNode)
        if (endEl) {
          const node = document.createTextNode('')
          endEl.parentNode?.insertBefore(node, endEl)
          endNode = node
          endOffset = 0
        }
      }

      s.setBaseAndExtent(startNode, startOffset, endNode, endOffset)
      element.normalize()
    }

    function uneditable(node) {
      while (node && node !== element) {
        if (node.nodeType === Node.ELEMENT_NODE) {
          if (node.getAttribute('contenteditable') === 'false') {
            return node
          }
        }
        node = node.parentNode
      }
    }

    function doUndo(event) {
      preventDefault(event)
      at--
      const record = history[at]
      if (record) {
        element.innerHTML = record.html
        restore(record.pos)
      }
      if (at < 0) at = 0
    }

    function doRedo(event) {
      preventDefault(event)
      at++
      const record = history[at]
      if (record) {
        element.innerHTML = record.html
        restore(record.pos)
      }
      if (at >= history.length) at--
    }

    function recordHistory() {
      const html = element.innerHTML
      const pos = save()
      const lastRecord = history[at]
      if (
        lastRecord
        && lastRecord.html === html
        && lastRecord.pos.start === pos.start
        && lastRecord.pos.end === pos.end
      ) return
      at++
      history[at] = {html, pos}
      history.splice(at + 1)
      const maxHistory = 10_000
      if (at > maxHistory) {
        at = maxHistory
        history.splice(0, 1)
      }
    }

    function visit(editor, visitor) {
      const queue = []
      if (editor.firstChild) queue.push(editor.firstChild)
      let el = queue.pop()
      while (el) {
        if (visitor(el) === 'stop') break
        if (el.nextSibling) queue.push(el.nextSibling)
        if (el.firstChild) queue.push(el.firstChild)
        el = queue.pop()
      }
    }

    function isCtrl(event) {
      return event.metaKey || event.ctrlKey
    }

    function isUndo(event) {
      return isCtrl(event) && !event.shiftKey && event.code === 'KeyZ'
    }

    function isRedo(event) {
      return isCtrl(event) && event.shiftKey && event.code === 'KeyZ'
    }

    function toString() {
      return element.textContent || ''
    }

    function preventDefault(event) {
      event.preventDefault()
    }

    function getSelection() {
      return element.getRootNode().getSelection()
    }

    return {
      set(content) {
        element.textContent = content
        highlight(element)
      },
      destroy() {
        for (const [type, fn] of listeners) editor.removeEventListener(type, fn)
      },
    }
  }
</script>
